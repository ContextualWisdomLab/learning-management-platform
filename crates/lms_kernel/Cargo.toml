[package]
name = "lms_kernel"
version = "0.1.0"
edition = "2024"
description = "Tenant-safe learning-management domain kernel"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
