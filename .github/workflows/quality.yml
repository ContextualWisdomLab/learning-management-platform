name: Learning Management Quality

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: learning-management-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate bootstrap contract
        shell: python3 {0}
        run: |
          from pathlib import Path

          required = [
              Path("README.md"),
              Path("AGENTS.md"),
              Path("CLAUDE.md"),
              Path("CHANGELOG.md"),
              Path("docs/ARCHITECTURE.md"),
              Path("docs/DATA_MODEL.md"),
              Path("docs/adr/0001-learning-authority-boundary.md"),
              Path("docs/doctoring/STANDARD_TRACEABILITY.md"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"missing required bootstrap files: {missing}")

          architecture = Path("docs/ARCHITECTURE.md").read_text(encoding="utf-8")
          required_terms = ("learner", "affiliation", "sponsor", "enrollment", "completion")
          absent = [term for term in required_terms if term.lower() not in architecture.lower()]
          if absent:
              raise SystemExit(f"LMS architecture is missing learner-boundary terms: {absent}")

          forbidden = ("TODO: replace", "TBD: replace", "PLACEHOLDER_REPLACE")
          for path in required:
              text = path.read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f"unresolved bootstrap marker {marker!r} in {path}")

          workflow = Path(".github/workflows/quality.yml").read_text(encoding="utf-8")
          if "|" + " python3" in workflow:
              raise SystemExit("workflow must not execute curl responses through an interpreter")
          if "postgres:18-alpine@sha256:" not in workflow:
              raise SystemExit("PostgreSQL CI service image must be pinned by digest")

          print("learning management bootstrap contract validation passed")

  rust-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: lms_kernel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_kernel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure separated migration and application roles
        env:
          PGPASSWORD: ci-only
        run: |
          psql --host 127.0.0.1 --username postgres --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE lms_migrator LOGIN PASSWORD 'migration-only' NOSUPERUSER NOBYPASSRLS"
          psql --host 127.0.0.1 --username postgres --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE lms_kernel LOGIN PASSWORD 'ci-only' NOSUPERUSER NOBYPASSRLS"
          psql --host 127.0.0.1 --username postgres --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "ALTER DATABASE lms_kernel_test OWNER TO lms_migrator"
          psql --host 127.0.0.1 --username postgres --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "REVOKE ALL ON DATABASE lms_kernel_test FROM lms_kernel; GRANT CONNECT ON DATABASE lms_kernel_test TO lms_kernel"
          role_flags=$(psql --host 127.0.0.1 --username postgres --dbname postgres \
            --tuples-only --no-align \
            --command "SELECT string_agg(rolname || ':' || CASE WHEN rolsuper THEN 't' ELSE 'f' END || '|' || CASE WHEN rolbypassrls THEN 't' ELSE 'f' END, ';' ORDER BY rolname) FROM pg_roles WHERE rolname IN ('lms_kernel', 'lms_migrator')")
          test "$role_flags" = 'lms_kernel:f|f;lms_migrator:f|f'
          test "$(psql --host 127.0.0.1 --username postgres --dbname postgres --tuples-only --no-align --command "SELECT pg_has_role('lms_kernel', 'lms_migrator', 'MEMBER')")" = 'f'
          PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --set ON_ERROR_STOP=1 \
            --command "REVOKE CREATE ON SCHEMA public FROM PUBLIC" \
            --file migrations/0001_learning_kernel.sql
          PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --set ON_ERROR_STOP=1 \
            --command "GRANT USAGE ON SCHEMA public TO lms_kernel; GRANT SELECT ON TABLE learning_tenant TO lms_kernel; GRANT SELECT, INSERT ON TABLE login_identity_reference, learner_profile, tenant_membership, course_offering, access_entitlement, enrollment_record, learning_registration TO lms_kernel"
          test "$(PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test --tuples-only --no-align --command "SELECT count(*) FROM pg_class relation JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace JOIN pg_roles owner ON owner.oid = relation.relowner WHERE namespace.nspname = 'public' AND relation.relkind = 'r' AND relation.relname IN ('learning_tenant', 'login_identity_reference', 'learner_profile', 'tenant_membership', 'learning_affiliation', 'completion_policy', 'completion_policy_revision', 'decision_evidence_reference', 'completion_decision', 'completion_decision_evidence', 'course_offering', 'access_entitlement', 'enrollment_record', 'learning_registration') AND owner.rolname = 'lms_migrator'")" = '14'
          test "$(PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test --tuples-only --no-align --command "SELECT has_schema_privilege('lms_kernel', 'public', 'CREATE')")" = 'f'
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Install pinned Rust components
        run: rustup component add rustfmt clippy --toolchain 1.97.1
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Run domain and adapter tests
        run: cargo +1.97.1 test --workspace --all-targets --locked
      - name: Run Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Build public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --workspace --no-deps --locked
      - name: Verify authorized enrollment, RLS, and rollback-reapply contracts
        env:
          DATABASE_URL: postgres://lms_kernel:ci-only@127.0.0.1:5432/lms_kernel_test
          LMS_BIND_ADDRESS: 127.0.0.1:8080
        run: |
          tenant_id=$(python3 -c 'import uuid; print(uuid.uuid4())')
          other_tenant_id=$(python3 -c 'import uuid; print(uuid.uuid4())')
          api_key='ci-tenant-key'
          api_key_sha256=$(printf %s "$api_key" | sha256sum | cut -d ' ' -f 1)
          export LMS_TENANT_API_KEY_SHA256="{\"$tenant_id\":\"$api_key_sha256\"}"

          for tenant_spec in "$tenant_id:ci-tenant" "$other_tenant_id:other-tenant"; do
            current_tenant_id=${tenant_spec%%:*}
            current_tenant_slug=${tenant_spec#*:}
            PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
              --set ON_ERROR_STOP=1 \
              --command "BEGIN; SET LOCAL app.tenant_id = '$current_tenant_id'; INSERT INTO learning_tenant (tenant_id, tenant_slug) VALUES ('$current_tenant_id', '$current_tenant_slug'); COMMIT;"
          done

          if PGPASSWORD=ci-only psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --set ON_ERROR_STOP=1 \
            --command "ALTER TABLE learning_tenant DISABLE ROW LEVEL SECURITY" > "$RUNNER_TEMP/app_alter_rls.log" 2>&1; then
            cat "$RUNNER_TEMP/app_alter_rls.log"
            echo "application role unexpectedly altered RLS" >&2
            exit 1
          fi

          cargo +1.97.1 build --bin lms_api --locked
          target/debug/lms_api > "$RUNNER_TEMP/lms_api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          attempt=0
          until curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lms_api.log"
              exit 1
            fi
            attempt=$((attempt + 1))
            test "$attempt" -lt 60
            sleep 1
          done
          test "$(PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_constraint WHERE conname = 'completion_decision_registration_fk'")" = '1'
          payload='{"identity_authority":"keyverse","external_subject_reference":"ci-subject","membership_status":"active"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' --data "$payload" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners")" = '401'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' --header "authorization: Bearer $api_key" --data "$payload" \
            "http://127.0.0.1:8080/v1/tenants/$other_tenant_id/learners")" = '403'
          test "$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' --header "authorization: Bearer $api_key" \
            --data "$payload" --write-out '%{http_code}' \
            --output "$RUNNER_TEMP/lms_api_response.json" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners")" = '201'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' --header "authorization: Bearer $api_key" --data "$payload" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners")" = '409'
          learner_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["learner_id"])' "$RUNNER_TEMP/lms_api_response.json")
          visible_tenant_count=$(PGPASSWORD=ci-only psql --quiet --tuples-only --no-align \
            --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --command "SET app.tenant_id = '$tenant_id'" \
            --command "SELECT count(*) FROM learning_tenant")
          test "$visible_tenant_count" = '1'
          if PGPASSWORD=ci-only psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --set ON_ERROR_STOP=1 \
            --command "BEGIN; SET LOCAL app.tenant_id = '$tenant_id'; INSERT INTO tenant_membership (tenant_id, learner_id, membership_status, valid_from) VALUES ('$other_tenant_id', '$learner_id', 'active', now()); COMMIT;" > "$RUNNER_TEMP/cross_tenant_insert.log" 2>&1; then
            cat "$RUNNER_TEMP/cross_tenant_insert.log"
            echo "cross-tenant insert unexpectedly succeeded" >&2
            exit 1
          fi
          grep -qi 'row-level security' "$RUNNER_TEMP/cross_tenant_insert.log"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' \
            --data '{"offering_name":"Denied","content_release_reference":"content-release/v1/denied"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/offerings")" = '401'
          nil_id='00000000-0000-0000-0000-000000000000'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' --data '{}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$nil_id/entitlements")" = '401'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' --data '{}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$nil_id/enrollments")" = '401'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' --data '{}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$nil_id/enrollments/$nil_id/registrations")" = '401'
          curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' --header "authorization: Bearer $api_key" \
            --data '{"offering_name":"Partner Academy Basics","content_release_reference":"content-release/v1/partner-basics"}' \
            --output "$RUNNER_TEMP/offering_response.json" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/offerings"
          offering_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["course_offering_id"])' "$RUNNER_TEMP/offering_response.json")
          curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' --header "authorization: Bearer $api_key" \
            --data '{"source_authority":"billing-control-plane","external_entitlement_reference":"entitlement-ci-1","source_digest":"sha256:ci","source_version":"v1"}' \
            --output "$RUNNER_TEMP/entitlement_response.json" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/entitlements"
          entitlement_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["access_entitlement_id"])' "$RUNNER_TEMP/entitlement_response.json")
          curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' --header "authorization: Bearer $api_key" \
            --data "{\"course_offering_id\":\"$offering_id\",\"access_entitlement_id\":\"$entitlement_id\"}" \
            --output "$RUNNER_TEMP/enrollment_response.json" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/enrollments"
          enrollment_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["enrollment_record_id"])' "$RUNNER_TEMP/enrollment_response.json")
          curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' --header "authorization: Bearer $api_key" \
            --data '{"external_registration_reference":"registration-ci-1"}' \
            --output "$RUNNER_TEMP/registration_response.json" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/enrollments/$enrollment_id/registrations"
          registration_id=$(python3 -c 'import json, sys; response=json.load(open(sys.argv[1], encoding="utf-8")); assert response["registration_status"] == "registered"; print(response["learning_registration_id"])' "$RUNNER_TEMP/registration_response.json")
          PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --set ON_ERROR_STOP=1 \
            --command "BEGIN; SET LOCAL app.tenant_id = '$tenant_id'; UPDATE learning_registration SET registration_status = 'closed' WHERE tenant_id = '$tenant_id' AND learning_registration_id = '$registration_id'; COMMIT;"
          test "$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' --header "authorization: Bearer $api_key" \
            --data '{"external_registration_reference":"registration-ci-2"}' \
            --output "$RUNNER_TEMP/reregistration_response.json" --write-out '%{http_code}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/enrollments/$enrollment_id/registrations")" = '201'
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1], encoding="utf-8"))["registration_status"] == "registered"' "$RUNNER_TEMP/reregistration_response.json"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' --header "authorization: Bearer $api_key" \
            --data '{"external_registration_reference":"registration-ci-2"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/enrollments/$enrollment_id/registrations")" = '409'
          test "$(PGPASSWORD=ci-only psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --tuples-only --no-align \
            --command "SET app.tenant_id = '$tenant_id'" \
            --command "SELECT count(*) FROM learning_registration WHERE tenant_id = '$tenant_id' AND enrollment_record_id = '$enrollment_id'")" = '2'
          test "$(PGPASSWORD=ci-only psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --tuples-only --no-align \
            --command "SET app.tenant_id = '$tenant_id'" \
            --command "SELECT count(*) FROM enrollment_record WHERE tenant_id = '$tenant_id' AND learner_id = '$learner_id'")" = '1'
          kill "$api_pid" 2>/dev/null || true
          wait "$api_pid" 2>/dev/null || true
          trap - EXIT

          PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --set ON_ERROR_STOP=1 --file scripts/postgres_rollback_rehearsal.sql
          table_count=$(PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_class WHERE relkind = 'r' AND relname IN ('learning_tenant', 'login_identity_reference', 'learner_profile', 'tenant_membership', 'learning_affiliation', 'completion_policy', 'completion_policy_revision', 'decision_evidence_reference', 'completion_decision', 'completion_decision_evidence', 'course_offering', 'access_entitlement', 'enrollment_record', 'learning_registration')")
          test "$table_count" = '0'

          PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --set ON_ERROR_STOP=1 --file migrations/0001_learning_kernel.sql
          PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --set ON_ERROR_STOP=1 \
            --command "GRANT USAGE ON SCHEMA public TO lms_kernel; GRANT SELECT ON TABLE learning_tenant TO lms_kernel; GRANT SELECT, INSERT ON TABLE login_identity_reference, learner_profile, tenant_membership, course_offering, access_entitlement, enrollment_record, learning_registration TO lms_kernel"

          policy_count=$(PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_policies WHERE schemaname = 'public'")
          forced_rls_count=$(PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_class relation JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace WHERE namespace.nspname = 'public' AND relation.relrowsecurity AND relation.relforcerowsecurity")
          owner_count=$(PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_class relation JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace JOIN pg_roles owner ON owner.oid = relation.relowner WHERE namespace.nspname = 'public' AND relation.relkind = 'r' AND relation.relname IN ('learning_tenant', 'login_identity_reference', 'learner_profile', 'tenant_membership', 'learning_affiliation', 'completion_policy', 'completion_policy_revision', 'decision_evidence_reference', 'completion_decision', 'completion_decision_evidence', 'course_offering', 'access_entitlement', 'enrollment_record', 'learning_registration') AND owner.rolname = 'lms_migrator'")
          test "$policy_count" = '12'
          test "$forced_rls_count" = '12'
          test "$owner_count" = '14'
          test "$(PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test --tuples-only --no-align --command "SELECT has_schema_privilege('lms_kernel', 'public', 'CREATE')")" = 'f'
          test "$(PGPASSWORD=migration-only psql --host 127.0.0.1 --username lms_migrator --dbname lms_kernel_test --tuples-only --no-align --command "SELECT has_table_privilege('lms_kernel', 'learning_tenant', 'SELECT') AND NOT has_table_privilege('lms_kernel', 'learning_tenant', 'DELETE')")" = 't'
          if PGPASSWORD=ci-only psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --set ON_ERROR_STOP=1 \
            --command "ALTER TABLE learning_tenant DISABLE ROW LEVEL SECURITY" > "$RUNNER_TEMP/app_alter_rls_after_reapply.log" 2>&1; then
            cat "$RUNNER_TEMP/app_alter_rls_after_reapply.log"
            echo "application role unexpectedly altered RLS after reapply" >&2
            exit 1
          fi
