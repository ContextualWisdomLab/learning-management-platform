name: Learning Management Quality

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: learning-management-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate bootstrap contract
        shell: python3 {0}
        run: |
          from pathlib import Path

          required = [
              Path("README.md"),
              Path("AGENTS.md"),
              Path("CLAUDE.md"),
              Path("CHANGELOG.md"),
              Path("docs/ARCHITECTURE.md"),
              Path("docs/DATA_MODEL.md"),
              Path("docs/adr/0001-learning-authority-boundary.md"),
              Path("docs/doctoring/STANDARD_TRACEABILITY.md"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"missing required bootstrap files: {missing}")

          architecture = Path("docs/ARCHITECTURE.md").read_text(encoding="utf-8")
          required_terms = ("learner", "affiliation", "sponsor", "enrollment", "completion")
          absent = [term for term in required_terms if term.lower() not in architecture.lower()]
          if absent:
              raise SystemExit(f"LMS architecture is missing learner-boundary terms: {absent}")

          forbidden = ("TODO: replace", "TBD: replace", "PLACEHOLDER_REPLACE")
          for path in required:
              text = path.read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f"unresolved bootstrap marker {marker!r} in {path}")

          print("learning management bootstrap contract validation passed")

  rust-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lms_kernel_test
          POSTGRES_USER: lms_kernel
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_kernel -d lms_kernel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Install pinned Rust components
        run: rustup component add rustfmt clippy --toolchain 1.97.1
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Run domain tests
        run: cargo +1.97.1 test --workspace --all-targets --locked
      - name: Run Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Build public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --workspace --no-deps --locked
      - name: Run learner enrollment API smoke test
        env:
          DATABASE_URL: postgres://lms_kernel:ci-only@127.0.0.1:5432/lms_kernel_test
          PGPASSWORD: ci-only
          LMS_BIND_ADDRESS: 127.0.0.1:8080
        run: |
          cargo +1.97.1 build --bin lms_api --locked
          target/debug/lms_api > "$RUNNER_TEMP/lms_api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          attempt=0
          until curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; do
            attempt=$((attempt + 1))
            test "$attempt" -lt 60
            sleep 1
          done
          policy_count=$(psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_policies WHERE schemaname = 'public'")
          test "$policy_count" = '15'
          test "$(psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_constraint WHERE conname = 'completion_decision_registration_fk'")" = '1'
          tenant_id=$(python3 -c 'import uuid; print(uuid.uuid4())')
          psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --set ON_ERROR_STOP=1 \
            --command "BEGIN; SET LOCAL app.tenant_id = '$tenant_id'; INSERT INTO learning_tenant (tenant_id, tenant_slug) VALUES ('$tenant_id', 'ci-tenant'); COMMIT;"
          payload='{"identity_authority":"keyverse","external_subject_reference":"ci-subject","membership_status":"active"}'
          curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data "$payload" \
            --write-out '%{http_code}' \
            --output "$RUNNER_TEMP/lms_api_response.json" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners" | grep -x '201'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' --data "$payload" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners")" = '409'
          learner_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["learner_id"])' "$RUNNER_TEMP/lms_api_response.json")
          affiliation_id=$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"affiliation_kind":"partner"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/affiliations" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["learning_affiliation_id"])')
          test -n "$affiliation_id"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' --data '{"affiliation_kind":"partner"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/affiliations")" = '409'
          offering_id=$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"offering_name":"Partner Academy Basics","content_release_reference":"content-release/v1/partner-basics"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/offerings" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["course_offering_id"])')
          entitlement_id=$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"source_authority":"billing-control-plane","external_entitlement_reference":"entitlement-ci-1","source_digest":"sha256:ci","source_version":"v1"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/entitlements" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_entitlement_id"])')
          enrollment_id=$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data "{\"course_offering_id\":\"$offering_id\",\"access_entitlement_id\":\"$entitlement_id\"}" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/enrollments" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["enrollment_record_id"])')
          curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"external_registration_reference":"registration-ci-1"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/enrollments/$enrollment_id/registrations" \
            --output "$RUNNER_TEMP/lms_registration_response.json"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["registration_status"] == "registered"' "$RUNNER_TEMP/lms_registration_response.json"
          registration_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["learning_registration_id"])' "$RUNNER_TEMP/lms_registration_response.json")
          attempt_id=$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"external_attempt_reference":"attempt-ci-1","content_release_reference":"content-release/v1/partner-basics"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/registrations/$registration_id/attempts" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["learning_attempt_id"])')
          curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"source_authority":"lrs","external_activity_reference":"activity-ci-1","source_version":"v1","source_digest":"sha256:ci-progress","progress_state":"in_progress","progress_percent":50,"observed_at":"2026-01-01T00:00:00Z"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/attempts/$attempt_id/progress" \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["progress_state"] == "in_progress"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' \
            --data '{"source_authority":"lrs","external_activity_reference":"activity-ci-1","source_version":"v1","source_digest":"sha256:ci-progress-old","progress_state":"in_progress","progress_percent":25,"observed_at":"2025-01-01T00:00:00Z"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/attempts/$attempt_id/progress")" = '400'
          test "$(psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --tuples-only --no-align --command "SELECT count(*) FROM progress_projection WHERE tenant_id = '$tenant_id' AND learner_id = '$learner_id'")" = '1'
          policy_id=$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"policy_name":"Completion CI"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/completion-policies" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["completion_policy_id"])')
          revision_id=$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"revision_number":1,"required_evidence_kinds":["activity","assessment"]}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/completion-policies/$policy_id/revisions" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["completion_policy_revision_id"])')
          evidence_id=$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"evidence_kind":"activity","source_authority":"lrs","source_snapshot_reference":"snapshot-ci-1","source_digest":"sha256:ci-evidence","source_version":"v1"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/registrations/$registration_id/evidence" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["decision_evidence_reference_id"])')
          curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"contract_version":"assessment_result_reference/v1","assessment_authority":"psychometrics-commons","external_result_reference":"assessment-result-ci-1","source_digest":"sha256:ci-assessment","source_version":"v1","assessment_result_status":"passed","idempotency_key":"assessment-ci-idempotency-1","observed_at":"2026-01-01T00:00:00Z"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/registrations/$registration_id/assessment-results" \
            --output "$RUNNER_TEMP/lms_assessment_response.json"
          assessment_evidence_id=$(python3 -c 'import json, sys; result=json.load(open(sys.argv[1])); assert result["assessment_result_status"] == "passed"; print(result["decision_evidence_reference_id"])' "$RUNNER_TEMP/lms_assessment_response.json")
          assessment_retry_id=$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"contract_version":"assessment_result_reference/v1","assessment_authority":"psychometrics-commons","external_result_reference":"assessment-result-ci-1","source_digest":"sha256:ci-assessment","source_version":"v1","assessment_result_status":"passed","idempotency_key":"assessment-ci-idempotency-1","observed_at":"2026-01-01T00:00:00Z"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/registrations/$registration_id/assessment-results" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["decision_evidence_reference_id"])')
          test "$assessment_retry_id" = "$assessment_evidence_id"
          curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data "{\"completion_policy_revision_id\":\"$revision_id\",\"evidence_reference_ids\":[\"$evidence_id\",\"$assessment_evidence_id\"]}" \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/registrations/$registration_id/completion-decisions" \
            --output "$RUNNER_TEMP/lms_completion_response.json"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["completion_status"] == "completed"' "$RUNNER_TEMP/lms_completion_response.json"
          decision_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["completion_decision_id"])' "$RUNNER_TEMP/lms_completion_response.json")
          test "$(psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --tuples-only --no-align --command "SELECT count(*) FROM completion_decision WHERE tenant_id = '$tenant_id' AND learner_id = '$learner_id'")" = '1'
          test "$(psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --tuples-only --no-align --command "SELECT count(*) FROM decision_evidence_reference WHERE tenant_id = '$tenant_id' AND learner_id = '$learner_id' AND evidence_kind = 'assessment'")" = '1'
          credential_id=$(curl --fail --silent --show-error --request POST \
            --header 'content-type: application/json' \
            --data '{"credential_authority":"open-badges","external_credential_reference":"credential-ci-1"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/registrations/$registration_id/completion-decisions/$decision_id/credentials" \
            | python3 -c 'import json, sys; result=json.load(sys.stdin); assert result["credential_status"] == "issued"; print(result["credential_record_id"])')
          test -n "$credential_id"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'content-type: application/json' \
            --data '{"credential_authority":"open-badges","external_credential_reference":"credential-ci-1"}' \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/registrations/$registration_id/completion-decisions/$decision_id/credentials")" = '409'
          curl --fail --silent --show-error --request POST \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/registrations/$registration_id/completion-decisions/$decision_id/credentials/$credential_id/revoke" \
            --output "$RUNNER_TEMP/lms_credential_revoke_response.json"
          python3 -c 'import json, sys; result=json.load(open(sys.argv[1])); assert result["credential_status"] == "revoked" and result["revoked_at"]' "$RUNNER_TEMP/lms_credential_revoke_response.json"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            "http://127.0.0.1:8080/v1/tenants/$tenant_id/learners/$learner_id/registrations/$registration_id/completion-decisions/$decision_id/credentials/$credential_id/revoke")" = '200'
          test "$(psql --host 127.0.0.1 --username lms_kernel --dbname lms_kernel_test \
            --tuples-only --no-align --command "SELECT count(*) FROM credential_record WHERE tenant_id = '$tenant_id' AND learner_id = '$learner_id' AND credential_status = 'revoked'")" = '1'
